<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Zero Day Defence</title>
<style>
  body { margin: 0; height: 100dvh; overflow: hidden; background: #050a12; font-family: ui-monospace, Menlo, Consolas, monospace;
         touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
         display: flex; justify-content: center; }
  /* portrait play column: full width on phones, a 9:16 strip centred on desktop */
  #game { position: relative; height: 100dvh; width: min(100vw, 56.25dvh); }
  canvas { display: block; width: 100%; height: 100%; }
  #over { display: none; position: absolute; inset: 0; background: rgba(40,0,0,0.8); color: #fff;
          flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; }
  #over.show { display: flex; }
  #over h1 { margin: 0; color: #ff4444; font-size: clamp(26px, 9vw, 44px); }
  #over p { margin: 0; font-size: 18px; }
  button { margin-top: 14px; padding: 14px 28px; font: bold 18px ui-monospace, Menlo, Consolas, monospace; border: 0; border-radius: 10px;
           background: #2ee6a6; color: #032; }
  #start { display: flex; position: absolute; inset: 0; background: rgba(5,10,18,0.92); color: #cfe;
           flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; gap: 8px; }
  #start.hide { display: none; }
  #start h1 { margin: 0; color: #2ee6a6; font-size: clamp(26px, 9vw, 44px); }
  #start p { margin: 0; font-size: 15px; line-height: 1.5; }
  .sev { font-weight: bold; }
  #rotate { display: none; position: fixed; inset: 0; background: #111; color: #fff; font: bold 22px sans-serif;
            align-items: center; justify-content: center; text-align: center; z-index: 9; }
  @media (orientation: landscape) and (pointer: coarse) { #rotate { display: flex; } }
</style>
</head>
<body>
<div id="game">
  <canvas id="c"></canvas>
  <div id="start">
    <h1>ZERO DAY<br>DEFENCE</h1>
    <p>Zero-day exploits are racing down toward your infrastructure.</p>
    <p>Tap an infrastructure block to deploy a fix. A deploy takes <b>3 s</b> and only one can run at a time.</p>
    <p>Unpatched exploits drain system health:<br>
      <span class="sev" style="color:#ffd23f">LOW</span> &middot; <span class="sev" style="color:#ff8c1a">HIGH</span> &middot; <span class="sev" style="color:#ff2e4d">CRITICAL</span></p>
    <button id="go">START</button>
  </div>
  <div id="over"><h1>SYSTEM DOWN</h1><p id="final"></p><button id="again">TRY AGAIN</button></div>
</div>
<div id="rotate">↻<br>Rotate your device to portrait</div>
<script>
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');

const LANES = [
  { name: 'NETWORK', icon: '🌐' },
  { name: 'COMPUTE', icon: '🖥️' },
  { name: 'DATABASE', icon: '🗄️' },
  { name: 'CODE', icon: '💻' },
];
const SEV = [  // health drain in % per second while unpatched; travel speed in lane-lengths per second
  { name: 'LOW', color: '#ffd23f', drain: 0.6, speed: 0.13, weight: 6 },
  { name: 'HIGH', color: '#ff8c1a', drain: 1.5, speed: 0.17, weight: 3 },
  { name: 'CRITICAL', color: '#ff2e4d', drain: 3, speed: 0.22, weight: 1 },
];
const DEPLOY_TIME = 3;

let S;  // game state
function newState() {
  return { health: 100, time: 0, spawnIn: 1.5, exploits: [], deploy: null, over: false, patched: 0,
           hits: LANES.map(() => []) };  // hits[lane] = severities currently draining health
}

function pickSev() {
  let r = Math.random() * SEV.reduce((a, s) => a + s.weight, 0);
  return SEV.findIndex(s => (r -= s.weight) < 0);
}

// deploy a fix on a lane; refused while another deploy is running
function deploy(lane) {
  if (S.over || S.deploy) return false;
  S.deploy = { lane, left: DEPLOY_TIME };
  return true;
}

function update(dt) {
  if (S.over) return;
  S.time += dt;
  // spawns speed up over time: every 2.4 s at start, down to every 0.6 s; exploits also get a little faster
  const ramp = Math.min(1, S.time / 150);
  if ((S.spawnIn -= dt) <= 0) {
    S.spawnIn = 2.4 - 1.8 * ramp;
    S.exploits.push({ lane: Math.floor(Math.random() * LANES.length), sev: pickSev(), y: 0 });
  }
  for (const e of S.exploits) {
    e.y += SEV[e.sev].speed * (1 + ramp * 0.6) * dt;
    if (e.y >= 1) S.hits[e.lane].push(e.sev);
  }
  S.exploits = S.exploits.filter(e => e.y < 1);
  if (S.deploy && (S.deploy.left -= dt) <= 0) {
    S.patched += S.hits[S.deploy.lane].length;
    S.hits[S.deploy.lane] = [];  // fix patches every exploit that has hit this infra so far
    S.deploy = null;
  }
  for (const h of S.hits) for (const sev of h) S.health -= SEV[sev].drain * dt;
  if (S.health <= 0) {
    S.health = 0; S.over = true;
    $('final').textContent = `You held out for ${S.time.toFixed(1)} s and patched ${S.patched} zero-days.`;
    $('over').classList.add('show');
  }
}

// self-check: hits drain health, deploys block each other and patch after 3 s
S = newState();
S.spawnIn = 1e9;
S.exploits.push({ lane: 2, sev: 2, y: 0.999 });
update(0.1);
console.assert(S.hits[2].length === 1, 'exploit should hit the database');
console.assert(deploy(2) && !deploy(0), 'only one deploy at a time');
for (let i = 0; i < 29; i++) update(0.1);
console.assert(S.deploy && S.hits[2].length === 1, 'still deploying before 3 s');
update(0.11);
console.assert(!S.deploy && S.hits[2].length === 0 && Math.abs(S.health - (100 - 3 * 3)) < 0.5, 'patched after 3 s; critical drained ~3%/s');
console.assert(deploy(0), 'next deploy allowed once done');

// layout, in CSS pixels of the play column
let W, H, dpr;
function resize() {
  dpr = Math.min(devicePixelRatio, 2);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr;
}
addEventListener('resize', resize);
resize();
const TOP = () => 70, INFRA_H = () => Math.min(H * 0.17, 140), LANE_END = () => H - INFRA_H() - 16;
const laneX = i => W * (i + 0.5) / LANES.length;

function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#050a12'; ctx.fillRect(0, 0, W, H);
  const lw = W / LANES.length, t = performance.now() / 1000;

  // lanes: dashed data paths
  ctx.strokeStyle = '#123'; ctx.lineWidth = 2; ctx.setLineDash([6, 10]); ctx.lineDashOffset = -t * 30;
  for (let i = 0; i < LANES.length; i++) {
    ctx.beginPath(); ctx.moveTo(laneX(i), TOP()); ctx.lineTo(laneX(i), LANE_END()); ctx.stroke();
  }
  ctx.setLineDash([]);
  ctx.strokeStyle = '#0d1b2a';
  for (let i = 1; i < LANES.length; i++) { ctx.beginPath(); ctx.moveTo(lw * i, TOP()); ctx.lineTo(lw * i, H); ctx.stroke(); }

  // exploits
  const r = Math.min(lw * 0.28, 22);
  for (const e of S.exploits) {
    const x = laneX(e.lane), y = TOP() + e.y * (LANE_END() - TOP()), c = SEV[e.sev].color;
    ctx.shadowColor = c; ctx.shadowBlur = 16;
    ctx.fillStyle = c;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#000'; ctx.font = `bold ${r * 0.62}px ui-monospace, monospace`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('0day', x, y);
  }

  // infrastructure blocks
  const ih = INFRA_H(), iy = H - ih - 8;
  for (let i = 0; i < LANES.length; i++) {
    const x = lw * i + 5, w = lw - 10, hits = S.hits[i], dep = S.deploy?.lane === i;
    const worst = hits.length ? SEV[Math.max(...hits)].color : null;
    const blocked = S.deploy && !dep;
    ctx.fillStyle = worst ? `rgba(255,40,60,${0.18 + 0.12 * Math.sin(t * 8)})` : '#0c1a2a';
    rrect(x, iy, w, ih, 10); ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = worst || (dep ? '#2ee6a6' : '#1f3b57'); ctx.stroke();
    ctx.globalAlpha = blocked ? 0.4 : 1;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `${Math.min(w * 0.38, ih * 0.32)}px sans-serif`;
    ctx.fillText(LANES[i].icon, x + w / 2, iy + ih * 0.33);
    ctx.fillStyle = '#cfe'; ctx.font = `bold ${Math.min(w * 0.13, 14)}px ui-monospace, monospace`;
    ctx.fillText(LANES[i].name, x + w / 2, iy + ih * 0.62);
    if (hits.length) {
      ctx.fillStyle = worst; ctx.fillText(`⚠ ${hits.length} BREACH${hits.length > 1 ? 'ES' : ''}`, x + w / 2, iy + ih * 0.82);
    } else if (!dep) {
      ctx.fillStyle = '#4a7'; ctx.fillText('SECURE', x + w / 2, iy + ih * 0.82);
    }
    if (dep) {  // deploy progress bar
      const p = 1 - S.deploy.left / DEPLOY_TIME;
      ctx.fillStyle = '#123'; ctx.fillRect(x + 8, iy + ih - 14, w - 16, 6);
      ctx.fillStyle = '#2ee6a6'; ctx.fillRect(x + 8, iy + ih - 14, (w - 16) * p, 6);
      if (!hits.length) { ctx.fillStyle = '#2ee6a6'; ctx.fillText('DEPLOYING', x + w / 2, iy + ih * 0.82); }
    }
    ctx.globalAlpha = 1;
  }

  // HUD: system health bar + timer
  const hp = S.health / 100, bw = W - 24;
  ctx.fillStyle = '#0c1a2a'; rrect(12, 14, bw, 22, 6); ctx.fill();
  ctx.fillStyle = hp > 0.6 ? '#2ee6a6' : hp > 0.3 ? '#ffd23f' : '#ff2e4d';
  rrect(12, 14, Math.max(0, bw * hp), 22, 6); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 13px ui-monospace, monospace'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(`SYSTEM HEALTH ${S.health.toFixed(0)}%`, 20, 25);
  ctx.textAlign = 'right'; ctx.fillStyle = '#9bd';
  ctx.fillText(`${S.time.toFixed(1)} s · patched ${S.patched}`, W - 14, 52);
  if (S.deploy) { ctx.textAlign = 'left'; ctx.fillStyle = '#2ee6a6'; ctx.fillText(`DEPLOYING FIX ${S.deploy.left.toFixed(1)} s`, 14, 52); }
}

cv.addEventListener('pointerdown', e => {
  const b = cv.getBoundingClientRect(), x = e.clientX - b.left, y = e.clientY - b.top;
  if (y < H - INFRA_H() - 8) return;
  deploy(Math.min(LANES.length - 1, Math.floor(x / (W / LANES.length))));
});
addEventListener('contextmenu', e => e.preventDefault());

let running = false;
function start() {
  S = newState(); running = true;
  $('start').classList.add('hide'); $('over').classList.remove('show');
}
$('go').onclick = start;
$('again').onclick = start;
S = newState();

let last = performance.now();
(function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (running) update(dt);
  draw();
  requestAnimationFrame(loop);
})(last);
</script>
</body>
</html>
