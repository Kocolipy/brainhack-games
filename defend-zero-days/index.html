<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Defend Zero Days</title>
<style>
  body { margin: 0; height: 100dvh; overflow: hidden; background: #050a12; font-family: ui-monospace, Menlo, Consolas, monospace;
         touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
         display: flex; justify-content: center; }
  /* portrait play column: full width on phones, a 9:16 strip centred on desktop */
  #game { position: relative; height: 100dvh; width: min(100vw, 56.25dvh); }
  canvas { display: block; width: 100%; height: 100%; }
  #over { display: none; position: absolute; inset: 0; background: rgba(40,0,0,0.8); color: #fff;
          flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; }
  #over.show { display: flex; }
  #over h1 { margin: 0; color: #ff4444; font-size: clamp(26px, 9vw, 44px); }
  #over p { margin: 0; font-size: 18px; }
  button { margin-top: 14px; padding: 14px 28px; font: bold 18px ui-monospace, Menlo, Consolas, monospace; border: 0; border-radius: 10px;
           background: #2ee6a6; color: #032; }
  #start { display: flex; position: absolute; inset: 0; background: rgba(5,10,18,0.92); color: #cfe;
           flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; gap: 8px; }
  #start.hide { display: none; }
  #start h1 { margin: 0; color: #2ee6a6; font-size: clamp(26px, 9vw, 44px); }
  #start p { margin: 0; font-size: 15px; line-height: 1.5; }
  .sev { font-weight: bold; }
  #rotate { display: none; position: fixed; inset: 0; background: #111; color: #fff; font: bold 22px sans-serif;
            align-items: center; justify-content: center; text-align: center; z-index: 9; }
  @media (orientation: landscape) and (pointer: coarse) { #rotate { display: flex; } }
</style>
</head>
<body>
<div id="game">
  <canvas id="c"></canvas>
  <div id="start">
    <h1>DEFEND<br>ZERO DAYS</h1>
    <p>Tap your infrastructure to patch zero-days.<br>Keep the system alive.</p>
    <button id="go">START</button>
  </div>
  <div id="over"><h1>SYSTEM DOWN</h1><p id="final"></p><button id="again">TRY AGAIN</button></div>
</div>
<div id="rotate">↻<br>Rotate your device to portrait</div>
<script src="../records.js"></script>
<script>
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');

const LANES = [
  { name: 'NETWORK', icon: 'network' },
  { name: 'COMPUTE', icon: 'compute' },
  { name: 'DATABASE', icon: 'database' },
  { name: 'CODE', icon: 'code' },
];
const SEV = [  // health drain in % per second while unpatched; travel speed in lane-lengths per second
  { name: 'LOW', color: '#ffd23f', drain: 0.6, speed: 0.13, weight: 6, icon: '0day_low' },
  { name: 'HIGH', color: '#ff8c1a', drain: 2.25, speed: 0.17, weight: 3, icon: '0day_high' },
  { name: 'CRITICAL', color: '#ff2e4d', drain: 6, speed: 0.22, weight: 1, icon: '0day_critical' },
];
// icons rendered in Blender (tools/make_icons.py); drawn once loaded
const IMG = {};
for (const n of [...LANES, ...SEV].map(o => o.icon)) { IMG[n] = new Image(); IMG[n].src = `assets/${n}.png`; }
const DEPLOY_TIME = 2;  // days to deploy a fix
const SPAWN_RATE = 1.25;  // exploit spawn rate multiplier
const EXPLOIT_SPEED = 1.5;  // exploit travel speed multiplier on top of SEV speeds
const days = (t, round = Math.floor) => { const d = round(t); return `${d} day${d === 1 ? '' : 's'}`; };  // 1 s of play = 1 day held

let S;  // game state
function newState() {
  return { health: 100, time: 0, spawnIn: 1.5, exploits: [], deploy: null, over: false, patched: 0,
           hits: LANES.map(() => []) };  // hits[lane] = exploits that reached that infra and are draining health
}

function pickSev() {
  let r = Math.random() * SEV.reduce((a, s) => a + s.weight, 0);
  return SEV.findIndex(s => (r -= s.weight) < 0);
}

const threatened = lane => S.hits[lane].length > 0 || S.exploits.some(e => e.lane === lane);
// deploy a fix on a lane; refused while another deploy is running, or if nothing threatens that lane
function deploy(lane) {
  if (S.over || S.deploy || !threatened(lane)) return false;
  // the fix covers every exploit on this lane right now, breached or in flight; later arrivals are not covered
  S.deploy = { lane, left: DEPLOY_TIME, covers: new Set([...S.hits[lane], ...S.exploits.filter(e => e.lane === lane)]) };
  return true;
}

function update(dt) {
  if (S.over) return;
  S.time += dt;
  // spawns speed up over time: every 2.4 s at start, down to every 0.6 s (both divided by SPAWN_RATE); exploits also get a little faster
  const ramp = Math.min(1, S.time / 150);
  if ((S.spawnIn -= dt) <= 0) {
    S.spawnIn = (2.4 - 1.8 * ramp) / SPAWN_RATE;
    S.exploits.push({ lane: Math.floor(Math.random() * LANES.length), sev: pickSev(), y: 0 });
  }
  for (const e of S.exploits) {
    e.y += SEV[e.sev].speed * EXPLOIT_SPEED * (1 + ramp * 0.6) * dt;
    if (e.y >= 1) S.hits[e.lane].push(e);
  }
  S.exploits = S.exploits.filter(e => e.y < 1);
  if (S.deploy && (S.deploy.left -= dt) <= 0) {
    const { lane, covers } = S.deploy;
    S.hits[lane] = S.hits[lane].filter(e => !covers.has(e));
    S.exploits = S.exploits.filter(e => !covers.has(e));
    S.patched += covers.size;
    S.deploy = null;
  }
  for (const h of S.hits) for (const e of h) S.health -= SEV[e.sev].drain * dt;
  if (S.health <= 0) {
    S.health = 0; S.over = true;
    $('final').textContent = `You held out for ${days(S.time)} and patched ${S.patched} zero-days.`;
    $('over').classList.add('show');
    // rating: completed at 30 days, stars at 50 / 75 / 100; personal best for the landing page = most days held
    const held = Math.floor(S.time), result = { completed: held >= 30, stars: records.stars(held, [50, 75, 100]) };
    records.show($('final'), result, ['Hold out for 50 days', 'Hold out for 75 days', 'Hold out for 100 days']);
    records.save('defend-zero-days', result,
      o => held > (o.days ?? -1) ? { days: held, patched: S.patched } : {});
  }
}

// self-check: hits drain health, deploys block each other, a fix covers only what existed when it started
S = newState();
S.spawnIn = 1e9;
console.assert(!deploy(2), 'no fix for an infra with nothing incoming');
const crit = { lane: 2, sev: 2, y: 0.999 }, low = { lane: 2, sev: 0, y: 0.5 };
S.exploits.push(crit, low, { lane: 0, sev: 0, y: 0.1 });
update(0.1);
console.assert(S.hits[2].length === 1, 'critical should hit the database');
console.assert(deploy(2) && !deploy(0), 'only one deploy at a time');
const late = { lane: 2, sev: 1, y: 0.9 };
S.exploits.push(late);  // arrives after the fix started: must not be covered
for (let i = 0; i < 19; i++) update(0.1);
console.assert(S.deploy && S.hits[2].length === 2, 'still deploying before 2 days (critical + late have hit)');
update(0.11);
console.assert(!S.deploy && S.hits[2].length === 1 && S.hits[2][0] === late, 'fix patches the breach and the in-flight low, not the late one');
console.assert(!S.exploits.includes(low) && S.patched === 2, 'in-flight exploit removed by the fix');
console.assert(Math.abs(S.health - (100 - 6 * 2 - 2.25 * 1.6)) < 0.8, 'critical drained ~6%/s, high ~2.25%/s');

// layout, in CSS pixels of the play column
let W, H, dpr;
function resize() {
  dpr = Math.min(devicePixelRatio, 2);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr;
}
addEventListener('resize', resize);
resize();
const TOP = () => 70, INFRA_H = () => Math.min(H * 0.17, 140), LANE_END = () => H - INFRA_H() - 16;
const laneX = i => W * (i + 0.5) / LANES.length;

function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#050a12'; ctx.fillRect(0, 0, W, H);
  const lw = W / LANES.length, t = performance.now() / 1000;

  // lanes: dashed data paths
  ctx.strokeStyle = '#123'; ctx.lineWidth = 2; ctx.setLineDash([6, 10]); ctx.lineDashOffset = -t * 30;
  for (let i = 0; i < LANES.length; i++) {
    ctx.beginPath(); ctx.moveTo(laneX(i), TOP()); ctx.lineTo(laneX(i), LANE_END()); ctx.stroke();
  }
  ctx.setLineDash([]);
  ctx.strokeStyle = '#0d1b2a';
  for (let i = 1; i < LANES.length; i++) { ctx.beginPath(); ctx.moveTo(lw * i, TOP()); ctx.lineTo(lw * i, H); ctx.stroke(); }

  // exploits
  const r = Math.min(lw * 0.28, 22);
  for (const e of S.exploits) {
    const x = laneX(e.lane), y = TOP() + e.y * (LANE_END() - TOP()), c = SEV[e.sev].color;
    ctx.shadowColor = c; ctx.shadowBlur = 18;
    ctx.save(); ctx.translate(x, y); ctx.rotate(t * 1.5 + e.lane);  // slow spin
    ctx.drawImage(IMG[SEV[e.sev].icon], -r * 1.3, -r * 1.3, r * 2.6, r * 2.6);
    ctx.restore();
    ctx.shadowBlur = 0;
  }

  // infrastructure blocks
  const ih = INFRA_H(), iy = H - ih - 8;
  for (let i = 0; i < LANES.length; i++) {
    const x = lw * i + 5, w = lw - 10, hits = S.hits[i], dep = S.deploy?.lane === i;
    const worst = hits.length ? SEV[Math.max(...hits.map(e => e.sev))].color : null;
    const incoming = S.exploits.some(e => e.lane === i), blocked = S.deploy ? !dep : !hits.length && !incoming;
    ctx.fillStyle = worst ? `rgba(255,40,60,${0.18 + 0.12 * Math.sin(t * 8)})` : '#0c1a2a';
    rrect(x, iy, w, ih, 10); ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = worst || (dep ? '#2ee6a6' : '#1f3b57'); ctx.stroke();
    ctx.globalAlpha = blocked ? 0.4 : 1;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const sz = Math.min(w * 0.8, ih * 0.58);
    ctx.drawImage(IMG[LANES[i].icon], x + (w - sz) / 2, iy + ih * 0.3 - sz / 2, sz, sz);
    ctx.fillStyle = '#cfe'; ctx.font = `bold ${Math.min(w * 0.13, 14)}px ui-monospace, monospace`;
    ctx.fillText(LANES[i].name, x + w / 2, iy + ih * 0.62);
    if (hits.length) {
      ctx.fillStyle = worst; ctx.fillText(`⚠ ${hits.length} BREACH${hits.length > 1 ? 'ES' : ''}`, x + w / 2, iy + ih * 0.82);
    } else if (!dep) {
      ctx.fillStyle = incoming ? '#ffd23f' : '#4a7'; ctx.fillText(incoming ? 'INCOMING' : 'SECURE', x + w / 2, iy + ih * 0.82);
    }
    if (dep) {  // deploy progress bar
      const p = 1 - S.deploy.left / DEPLOY_TIME;
      ctx.fillStyle = '#123'; ctx.fillRect(x + 8, iy + ih - 14, w - 16, 6);
      ctx.fillStyle = '#2ee6a6'; ctx.fillRect(x + 8, iy + ih - 14, (w - 16) * p, 6);
      if (!hits.length) { ctx.fillStyle = '#2ee6a6'; ctx.fillText('DEPLOYING', x + w / 2, iy + ih * 0.82); }
    }
    ctx.globalAlpha = 1;
  }

  // HUD: system health bar + timer
  const hp = S.health / 100, bw = W - 24;
  ctx.fillStyle = '#0c1a2a'; rrect(12, 14, bw, 22, 6); ctx.fill();
  ctx.fillStyle = hp > 0.6 ? '#2ee6a6' : hp > 0.3 ? '#ffd23f' : '#ff2e4d';
  rrect(12, 14, Math.max(0, bw * hp), 22, 6); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 13px ui-monospace, monospace'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(`SYSTEM HEALTH ${S.health.toFixed(0)}%`, 20, 25);
  ctx.textAlign = 'right'; ctx.fillStyle = '#9bd';
  ctx.fillText(`${days(S.time)} · patched ${S.patched}`, W - 14, 52);
  if (S.deploy) { ctx.textAlign = 'left'; ctx.fillStyle = '#2ee6a6'; ctx.fillText(`DEPLOYING FIX ${days(S.deploy.left, Math.ceil)}`, 14, 52); }
}

cv.addEventListener('pointerdown', e => {
  const b = cv.getBoundingClientRect(), x = e.clientX - b.left, y = e.clientY - b.top;
  if (y < H - INFRA_H() - 8) return;
  deploy(Math.min(LANES.length - 1, Math.floor(x / (W / LANES.length))));
});
addEventListener('contextmenu', e => e.preventDefault());
// any click or tap goes fullscreen (again, if the player left it); pointerup because browsers only allow it once a touch lifts; not supported on iPhone Safari
addEventListener('pointerup', () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().then(() => screen.orientation?.lock?.('portrait')).catch(() => {});
});

let running = false;
function start() {
  S = newState(); running = true;
  $('start').classList.add('hide'); $('over').classList.remove('show');
}
$('go').onclick = start;
$('again').onclick = start;
S = newState();

let last = performance.now();
(function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (running) update(dt);
  draw();
  requestAnimationFrame(loop);
})(last);
</script>
</body>
</html>
